# Render Blueprint: the whole backend (gateway + auth, chat, agent, billing)
# as one free web service, plus a free Key Value instance for sessions.
# See backend/start-all.js for how the processes are laid out.
services:
  - name: cortexai-api
    type: web
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm run install:all
    # node directly (not `npm start`) so no idle npm parent eats ~40 MB
    startCommand: node --max-old-space-size=32 start-all.js
    healthCheckPath: /
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cortexai-sessions
          property: connectionString
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: NODE_ENV
        value: production

      # Set these in the Render dashboard (prompted on first deploy).
      # Their meaning is documented in backend/.env.example.
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - name: cortexai-sessions
    type: keyvalue
    plan: free
    # empty list = reachable only from Render services in the same region
    ipAllowList: []
